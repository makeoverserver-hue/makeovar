services:
  - type: web
    name: clinic-x
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:/data/clinic.db
      - key: UPLOADS_DIR
        value: /data/uploads
      - key: BACKUPS_DIR
        value: /data/backups
      - key: CORS_ORIGIN
        value: ""
    healthCheckPath: /health
    autoDeploy: true